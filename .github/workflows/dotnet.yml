#
# Build and test only.
#

name: Build-Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    # we are running the builds and tests on Windows because we might want to build and test .NET Framework projects
    # if no .NET Framework projects are present, you can change this to ubuntu-latest to save some time and resources
    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:  
        fetch-depth: 0

    - name: Setup .NET 11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
